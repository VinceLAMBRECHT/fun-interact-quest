YAML
name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install & Build
        run: |
          bun install
          bun run build
          mkdir -p public-deploy
          if [ -d "dist" ]; then cp -r dist/* public-deploy/; fi
          if [ -d "build/client" ]; then cp -r build/client/* public-deploy/; fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
